name: Deploy MARKET Catálogo

# Deploy MANUAL: NO deploya en cada push. Se dispara a mano (Actions -> Run workflow, o desde la pantalla
# "Actualizar servidor" de MarketWeb vía la API de GitHub). Compila SIEMPRE origin/main.
# Corre en un self-hosted runner INSTALADO EN EL SERVER, registrado en ESTE repo (los runners son por
# repositorio: el de MARKETweb no puede correr jobs de acá).
on:
  workflow_dispatch:

# Un deploy a la vez.
concurrency:
  group: deploy-marketcatalogo
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, windows]
    env:
      # STAGING = carpeta temporal donde publica el build; MARKETServicios hace robocopy STAGING -> la
      # carpeta live del servicio (C:\Documentos\MarketCatalogo) y reinicia el servicio MarketCatalogo.
      STAGING: 'C:\Documentos\MarketCatalogo_stage'
      SERVICIOS_URL: 'http://127.0.0.1:8099'
      SERVICE_ID: 'catalogo'
      # Donde escucha el sitio en el server (lo define --urls en los AppParameters del servicio; si se
      # cambia allá, cambiarlo acá también o la verificación final da falso negativo).
      SITE_URL: 'http://127.0.0.1:8003'
    steps:
      - name: Checkout main (limpio, desde GitHub)
        uses: actions/checkout@v4

      - name: Publicar self-contained
        shell: powershell
        run: |
          dotnet publish src/MarketCatalogo.Web/MarketCatalogo.Web.csproj -c Release -r win-x64 --self-contained true -o "$env:STAGING"
          if ($LASTEXITCODE -ne 0) { throw "dotnet publish falló" }

      # El sitio es PÚBLICO y de solo lectura: reiniciarlo no corta ningún proceso del depósito, así que
      # acá NO va el paso de "esperar hueco sin candados" que sí tiene MarketWeb.
      - name: Deploy (stop -> robocopy -> start vía MARKETServicios)
        shell: powershell
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:DEPLOY_TOKEN)) { throw "Falta el secret DEPLOY_TOKEN" }
          $body = @{ staging = $env:STAGING } | ConvertTo-Json
          try {
            $r = Invoke-WebRequest -Uri "$($env:SERVICIOS_URL)/api/deploy/$($env:SERVICE_ID)" -Method Post `
                   -Headers @{ 'X-Deploy-Token' = $env:DEPLOY_TOKEN } -Body $body -ContentType 'application/json' `
                   -UseBasicParsing -TimeoutSec 60
            Write-Host "Deploy disparado OK (HTTP $($r.StatusCode)). MARKETServicios hace stop -> sync -> start."
          } catch {
            throw "MARKETServicios rechazo el deploy: $($_.Exception.Message)"
          }

      # A diferencia de MarketWeb, acá la request NO deberia cortarse: el que se reinicia es el servicio del
      # catalogo, no el que atiende esta llamada. Si falla, falla de verdad y el run queda en rojo.
      - name: Verificar que el sitio volvio a levantar
        shell: powershell
        run: |
          $url = $env:SITE_URL
          for ($i = 1; $i -le 20; $i++) {
            Start-Sleep -Seconds 3
            try {
              $r = Invoke-WebRequest -Uri $url -UseBasicParsing -TimeoutSec 10
              if ($r.StatusCode -eq 200) { Write-Host "Sitio arriba (HTTP 200) tras $($i * 3)s."; exit 0 }
            } catch { }
          }
          throw "El sitio no respondio 200 en 60s. Revisar C:\Documentos\MarketCatalogo\logs\err.log"

      # Que responda 200 no prueba que este corriendo lo que acabamos de compilar: puede haber quedado vivo
      # un build anterior (servicio que no reinicio, sync que no copio). /version dice de que commit salio el
      # build que esta corriendo, y lo comparamos con el commit del run. Sin esto, el 10/08/2026 dimos por
      # bueno un deploy mirando titulos de paginas a ojo.
      - name: Verificar que quedo vivo ESTE commit
        shell: powershell
        run: |
          $corto = "${{ github.sha }}".Substring(0,7)
          try {
            $v = (Invoke-WebRequest -Uri "$($env:SITE_URL.TrimEnd('/'))/version" -UseBasicParsing -TimeoutSec 15).Content.Trim()
          } catch {
            Write-Host "::warning::No se pudo leer /version ($($_.Exception.Message)). El sitio responde, pero no puedo confirmar la version."
            exit 0
          }
          Write-Host "Vivo: $v"
          Write-Host "Esperado: $corto"
          if ($v -like "$corto*") { Write-Host "OK: esta corriendo el commit de este run." }
          else { throw "El sitio responde pero con OTRA version. Vivo='$v', esperado='$corto'." }
